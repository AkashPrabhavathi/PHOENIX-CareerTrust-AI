services:
  - type: web
    name: careertrust-backend
    env: python
    buildCommand: pip install fastapi uvicorn python-dotenv dnspython openai requests python-multipart PyPDF2
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""